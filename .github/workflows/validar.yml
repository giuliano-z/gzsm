name: Validar plugin

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Skills, plantillas, enlaces y versiones
        run: python3 scripts/validar-skills.py
      - name: Manifiestos JSON
        run: |
          python3 -m json.tool .claude-plugin/marketplace.json > /dev/null
          python3 -m json.tool plugins/gzsm/.claude-plugin/plugin.json > /dev/null
      - name: Scripts de shell
        run: shellcheck scripts/*.sh
